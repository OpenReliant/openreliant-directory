name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.release-please.outputs.tag }}
      IMAGE: ghcr.io/openreliant/openreliant-directory
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag }}
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - name: Build and archive the Linux executables
        run: |
          mkdir -p dist/amd64 dist/arm64
          for target in x86_64 aarch64; do
            arch=amd64
            if [ "$target" = aarch64 ]; then arch=arm64; fi
            zig build -Dtarget="$target-linux-musl" -Doptimize=ReleaseSafe --prefix "zig-out/$target"
            cp "zig-out/$target/bin/openreliant-directory" "dist/$arch/"
            tar -C "dist/$arch" -czf "dist/openreliant-directory-$TAG-linux-$target.tar.gz" openreliant-directory
          done
      - name: Publish the multi-architecture image
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker buildx create --use --driver docker-container
          docker buildx build --platform linux/amd64,linux/arm64 --push \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.version=$TAG" \
            --tag "$IMAGE:$TAG" --tag "$IMAGE:latest" .
      - name: Attach Linux archives
        run: gh release upload "$TAG" dist/*.tar.gz

  announce:
    needs: [release-please, publish]
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Post the directory release to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_RELEASES_WEBHOOK }}
          TAG: ${{ needs.release-please.outputs.tag }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            printf '%s\n' 'Discord webhook is not configured.'
            exit 0
          fi
          release_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG"
          payload=$(jq -cn --arg title "OpenReliant Directory $TAG" --arg url "$release_url" \
            '{content: ("**" + $title + "**\n[Downloads and release notes](" + $url + ")"),
              allowed_mentions: {parse: []}}')
          curl --fail --silent --show-error --retry 3 --retry-max-time 40 --max-time 15 \
            --output /dev/null --header 'Content-Type: application/json' \
            --data "$payload" "$DISCORD_WEBHOOK?wait=true"
